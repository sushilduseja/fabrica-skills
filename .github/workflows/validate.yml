name: validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: lts/* }
      - run: npm ci
      - run: npm run check
      - run: node bin/fabrica-skills.mjs install
      - run: node bin/fabrica-skills.mjs status
      - run: node bin/fabrica-skills.mjs uninstall
